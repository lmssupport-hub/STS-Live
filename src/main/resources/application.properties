server.port=8080

spring.datasource.url=jdbc:postgresql://ep-red-violet-az5rwuds-pooler.c-3.ap-southeast-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require
spring.datasource.username=neondb_owner
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.mvc.pathmatch.matching-strategy=ant_path_matcher

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

jwt.secret=${JWT_SECRET}

# Resend HTTP API (replaces SMTP — Render free tier blocks SMTP ports)
resend.api.key=${RESEND_API_KEY}